<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조대부중 알아보기 퀴즈 🍁</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
/* 수업용 웹페이지 예시: Gemini Canvas로 만든 퀴즈와 같은 구성 (제목 · 학습 목표 · 진행도 · 즉시 피드백 · 결과 · 틀린 문제 다시 풀기) */
:root {
    --bg: #fbf6ee; --card: #ffffff; --line: #ece1d1;
    --accent: #d9622b; --accent-d: #b04c1d; --accent-soft: #fbebe0;
    --mustard: #e3a92f; --mustard-soft: #fbf1d9;
    --sage: #4f7f5f; --sage-soft: #e8f0e6;
    --brick: #a8432f; --brick-soft: #f8e6e0;
    --text: #2f2a25; --muted: #7a6f64;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Malgun Gothic', sans-serif; line-height: 1.6; word-break: keep-all; }
.wrap { max-width: 640px; margin: 0 auto; padding: 1.2rem 1rem 3rem; }
header { background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--accent); border-radius: 22px; padding: 1.3rem 1.3rem 1.1rem; margin-bottom: 1rem; position: relative; overflow: hidden; }
header::after { content: '🍁'; position: absolute; right: 1rem; bottom: 0.4rem; font-size: 3.4rem; opacity: 0.16; }
.badge { display: inline-block; background: var(--sage-soft); color: var(--sage); font-weight: 800; font-size: 0.78rem; border-radius: 999px; padding: 0.2rem 0.75rem; }
h1 { font-size: 1.6rem; margin: 0.5rem 0 0.3rem; }
h1 span { color: var(--accent); }
.goal { margin: 0; color: var(--muted); font-size: 0.95rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 1.3rem; }
.hidden { display: none !important; }

/* 시작 화면 */
.start ul { margin: 0.6rem 0 1.2rem; padding-left: 1.2rem; color: var(--muted); }
.btn { width: 100%; border: none; border-radius: 16px; padding: 1rem; font-size: 1.1rem; font-weight: 800; font-family: inherit; cursor: pointer; background: var(--accent); color: white; transition: background 0.15s, transform 0.15s; }
.btn:hover { background: var(--accent-d); }
.btn:active { transform: scale(0.98); }
.btn.sub { background: var(--card); color: var(--text); border: 1.5px solid var(--line); }
.btn.sub:hover { background: var(--accent-soft); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.6rem; }

/* 문제 화면 */
.top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; margin-bottom: 0.5rem; }
.top .score { color: var(--sage); }
.bar { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 1rem; }
.bar i { display: block; height: 100%; width: 0; background: var(--mustard); border-radius: 999px; transition: width 0.35s; }
.qnum { display: inline-block; background: var(--accent-soft); color: var(--accent-d); font-weight: 800; border-radius: 999px; padding: 0.15rem 0.7rem; font-size: 0.85rem; }
.q { font-size: 1.3rem; font-weight: 800; margin: 0.6rem 0 1rem; }
.opts { display: grid; gap: 0.6rem; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 0.95rem 1rem; font-size: 1.08rem; font-weight: 700; font-family: inherit; cursor: pointer; color: var(--text); display: flex; gap: 0.7rem; align-items: center; transition: border-color 0.15s, background 0.15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { flex-shrink: 0; width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem; }
.opt.ok { border-color: var(--sage); background: var(--sage-soft); }
.opt.no { border-color: var(--brick); background: var(--brick-soft); }
.opt:disabled { cursor: default; }
.fb { margin-top: 1rem; border-radius: 16px; padding: 0.9rem 1rem; font-size: 0.98rem; }
.fb.ok { background: var(--sage-soft); color: #2f5a3d; }
.fb.no { background: var(--brick-soft); color: #7a2e20; }
.fb b { display: block; font-size: 1.05rem; margin-bottom: 0.2rem; }
#next { margin-top: 1rem; }

/* 결과 화면 */
.result { text-align: center; }
.big { font-size: 3.2rem; font-weight: 900; color: var(--accent); line-height: 1.1; margin: 0.4rem 0; }
.msg { font-size: 1.1rem; font-weight: 800; margin-bottom: 0.4rem; }
.reflect { text-align: left; margin-top: 1.2rem; background: var(--mustard-soft); border-radius: 16px; padding: 1rem; }
.reflect label { font-weight: 800; display: block; margin-bottom: 0.4rem; }
.reflect textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 0.6rem 0.8rem; font-family: inherit; font-size: 1rem; resize: vertical; }
.src { margin-top: 1.2rem; font-size: 0.8rem; color: var(--muted); text-align: center; }
.src a { color: var(--sage); }
.leaf { position: fixed; top: -2rem; font-size: 1.6rem; pointer-events: none; animation: fall linear forwards; z-index: 50; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: 0.6; } }
@media (prefers-reduced-motion: reduce) { .leaf { display: none; } }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <span class="badge">수업용 웹페이지 예시 · 퀴즈 게임</span>
        <h1>우리 학교 <span>조대부중</span> 알아보기 퀴즈</h1>
        <p class="goal">🎯 오늘의 목표: 우리 학교의 교훈·상징·역사를 알고, 학교에 대한 자부심을 키울 수 있다.</p>
    </header>

    <!-- 시작 -->
    <section class="card start" id="start">
        <b>📋 이렇게 풀어요</b>
        <ul>
            <li>문제는 <b>10개</b>, 순서는 매번 바뀌어요.</li>
            <li>답을 누르면 바로 <b>정답과 해설</b>이 나와요.</li>
            <li>끝나면 <b>틀린 문제만 다시</b> 풀 수 있어요.</li>
        </ul>
        <button class="btn" onclick="startQuiz(QUESTIONS)">시작하기 🍁</button>
    </section>

    <!-- 문제 -->
    <section class="card hidden" id="quiz">
        <div class="top"><span id="count">1 / 10</span><span class="score" id="score">점수 0</span></div>
        <div class="bar"><i id="bar"></i></div>
        <span class="qnum" id="qnum">Q1</span>
        <p class="q" id="q"></p>
        <div class="opts" id="opts"></div>
        <div class="fb hidden" id="fb"></div>
        <button class="btn hidden" id="next" onclick="nextQ()">다음 문제 →</button>
    </section>

    <!-- 결과 -->
    <section class="card result hidden" id="result">
        <div class="msg" id="rmsg"></div>
        <div class="big" id="rscore"></div>
        <p class="goal" id="rsub"></p>
        <div class="row">
            <button class="btn sub" onclick="startQuiz(QUESTIONS)">처음부터 다시</button>
            <button class="btn" id="retryWrong" onclick="startQuiz(wrongList)">틀린 문제만 다시</button>
        </div>
        <div class="reflect">
            <label for="ref">✍️ 우리 학교에 대해 새로 알게 된 것 한 가지</label>
            <textarea id="ref" rows="2" placeholder="예) 교화가 동백꽃이고, 꽃말이 '겸손한 아름다움'이라는 것"></textarea>
        </div>
    </section>

    <p class="src">문제 출처: <a href="http://chosun.jge.ms.kr/sub/page.php?page_code=intro_04" target="_blank" rel="noopener">조선대학교부속중학교 홈페이지 학교소개(교훈/상징·연혁·교육목표)</a><br>이 페이지는 연수용 예시로, 개인정보를 입력받거나 저장하지 않습니다.</p>
</div>

<script>
// 문제: q 질문, o 보기, a 정답 번호(0부터), e 해설
const QUESTIONS = [
    { q: '조대부중의 교훈 네 가지에 들어가지 않는 것은?', o: ['성실(誠實)', '창조(創造)', '협동(協同)', '근면(勤勉)'], a: 2,
      e: '교훈은 성실(참되게) · 창조(새롭게) · 근면(부지런하게) · 숭미(아름답게)예요.' },
    { q: '교훈 "숭미(崇美)"의 뜻으로 알맞은 것은?', o: ['참되게', '새롭게', '부지런하게', '아름답게'], a: 3,
      e: '숭미(崇美)는 "아름답게"라는 뜻이에요. 참되게는 성실, 새롭게는 창조, 부지런하게는 근면이에요.' },
    { q: '조대부중의 교화(학교를 상징하는 꽃)는?', o: ['동백꽃', '개나리', '무궁화', '장미'], a: 0,
      e: '교화는 동백꽃이에요. "겸손한 아름다움"과 "사랑"을 뜻해요.' },
    { q: '"오천년 한민족의 기상"을 뜻하는 조대부중의 교목(학교 나무)은?', o: ['은행나무', '소나무', '느티나무', '벚나무'], a: 1,
      e: '교목은 소나무예요. 오천년 한민족의 기상과 전통문화를 뜻해요.' },
    { q: '"미래의 꿈과 이상"을 뜻하는 조대부중의 교색(학교 색)은?', o: ['RED', 'GREEN', 'BLUE', 'YELLOW'], a: 2,
      e: '교색은 BLUE예요. 미래의 꿈과 이상, 냉철한 이성과 학문을 뜻해요.' },
    { q: '조선대학교부속중학교가 처음 문을 연(개교) 해는?', o: ['1946년', '1948년', '1977년', '2000년'], a: 1,
      e: '1947년 7월에 설립되고, 1948년 7월 31일에 개교했어요. 1977년에는 지금의 교사(학교 건물)로 옮겼어요.' },
    { q: '조대부중의 3대 교육이념이 아닌 것은?', o: ['개성교육', '영재교육', '생산교육', '평화교육'], a: 3,
      e: '3대 교육이념은 개성교육 · 영재교육 · 생산교육이에요.' },
    { q: '2026년 3월부터 조대부중이 운영하고 있는 학교 사업은?', o: ['AI중점학교(정보교육 중심형)', '체육중점학교', '예술중점학교', '외국어중점학교'], a: 0,
      e: '2026년 3월 1일부터 AI중점학교(정보교육 중심형)로 선정되어 운영하고 있어요. 그래서 오늘 같은 AI 연수도 열려요!' },
    { q: '2025년 11월, 조대부중이 "대상"을 받은 대회는?', o: ['전국소년체육대회', '디지털새싹 해커톤 대회', '대한민국 관악경연대회', '전국 합창대회'], a: 1,
      e: '2025년 11월 21~22일 "2025 디지털새싹 해커톤 대회"에서 대상을 받았어요.' },
    { q: '조대부중 교육목표의 중심 문장에 들어갈 말은? "바른 ○○을 갖춘 창의 융합형 인재 육성"', o: ['체력', '인성', '외모', '성적'], a: 1,
      e: '교육목표는 "바른 인성을 갖춘 창의 융합형 인재 육성"이에요. "독·독·독(讀) 생각 키움! 꿈 키움!"도 함께 내세우고 있어요.' }
];

let list = [], idx = 0, score = 0, wrongList = [];
const $ = id => document.getElementById(id);
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
const show = id => ['start', 'quiz', 'result'].forEach(s => $(s).classList.toggle('hidden', s !== id));

function startQuiz(source) {
    if (!source.length) return;
    // 보기 순서도 섞되 정답 위치를 함께 옮긴다
    list = shuffle(source).map(item => {
        const order = shuffle(item.o.map((_, i) => i));
        return { ...item, o: order.map(i => item.o[i]), a: order.indexOf(item.a), src: item.src || item };
    });
    idx = 0; score = 0; wrongList = [];
    show('quiz'); render();
}
function render() {
    const it = list[idx];
    $('count').textContent = `${idx + 1} / ${list.length}`;
    $('score').textContent = `점수 ${score}`;
    $('bar').style.width = `${(idx / list.length) * 100}%`;
    $('qnum').textContent = `Q${idx + 1}`;
    $('q').textContent = it.q;
    $('opts').innerHTML = '';
    it.o.forEach((t, i) => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.innerHTML = `<span class="k">${'ABCD'[i]}</span><span></span>`;
        b.lastChild.textContent = t;
        b.onclick = () => answer(i);
        $('opts').appendChild(b);
    });
    $('fb').classList.add('hidden'); $('next').classList.add('hidden');
}
function answer(i) {
    const it = list[idx], ok = i === it.a, btns = [...$('opts').children];
    btns.forEach((b, j) => { b.disabled = true; if (j === it.a) b.classList.add('ok'); else if (j === i) b.classList.add('no'); });
    if (ok) { score++; leaves(6); } else wrongList.push(it.src);
    $('score').textContent = `점수 ${score}`;
    $('fb').className = 'fb ' + (ok ? 'ok' : 'no');
    $('fb').innerHTML = `<b>${ok ? '✔ 정답이에요!' : '✖ 아쉬워요. 정답은 ' + 'ABCD'[it.a] + '번!'}</b><span></span>`;
    $('fb').lastChild.textContent = it.e;
    $('next').textContent = idx === list.length - 1 ? '결과 보기 🏁' : '다음 문제 →';
    $('next').classList.remove('hidden');
    $('next').focus({ preventScroll: true });
}
function nextQ() {
    idx++;
    if (idx < list.length) { render(); return; }
    $('bar').style.width = '100%';
    const pct = score / list.length;
    $('rmsg').textContent = pct === 1 ? '🏆 만점! 조대부중 박사 인증!' : pct >= 0.7 ? '👏 우리 학교를 잘 알고 있어요!' : '🌱 조금만 더 알아볼까요?';
    $('rscore').textContent = `${score} / ${list.length}`;
    $('rsub').textContent = wrongList.length ? `틀린 문제 ${wrongList.length}개를 다시 풀어 보세요.` : '모든 문제를 맞혔어요!';
    $('retryWrong').disabled = !wrongList.length;
    $('retryWrong').style.opacity = wrongList.length ? 1 : 0.45;
    show('result');
    if (pct >= 0.7) leaves(24);
}
// 정답·좋은 결과일 때 단풍잎이 떨어지는 효과
function leaves(n) {
    for (let k = 0; k < n; k++) {
        const s = document.createElement('span');
        s.className = 'leaf'; s.textContent = ['🍁', '🍂', '🍃'][k % 3];
        s.style.left = Math.random() * 100 + 'vw';
        s.style.animationDuration = 1.8 + Math.random() * 1.6 + 's';
        s.style.animationDelay = Math.random() * 0.4 + 's';
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 4200);
    }
}
</script>
</body>
</html>
